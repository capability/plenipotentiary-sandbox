name: Deploy Docusaurus to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "packages/plenipotentiary-laravel/docs-site/**"
      - "packages/plenipotentiary-laravel/src/**"
      - ".github/workflows/deploy-docusaurus.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/plenipotentiary-laravel/docs-site
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install

      - name: Build site
        run: npm run build

      - name: Move build files to root
        run: |
          echo "Contents before move:"
          ls -la build/
          echo "Moving files from subfolder to root..."
          mv build/plenipotentiary-sandbox/* build/
          mv build/plenipotentiary-sandbox/.* build/ 2>/dev/null || true
          rm -rf build/plenipotentiary-sandbox
          echo "Contents after move:"
          ls -la build/
          echo "Checking for index.html:"
          ls -la build/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: packages/plenipotentiary-laravel/docs-site/build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
